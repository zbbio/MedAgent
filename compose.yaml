services:
  medagent:
    build:
      context: .
      dockerfile: Dockerfile
    image: medagent:local
    ports:
      - "${MEDAGENT_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
    volumes:
      - medagent-data:/app/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  medagent-data:
